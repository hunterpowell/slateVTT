<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98a4e"/>
      <stop offset="0.5" stop-color="#b87333"/>
      <stop offset="1" stop-color="#8a4b1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.5" stop-color="#f2c84b"/>
      <stop offset="1" stop-color="#c8961e"/>
    </linearGradient>
  </defs>

  <!-- back cover -->
  <rect x="12" y="9" width="44" height="52" rx="3" fill="#6e3a16"/>
  <!-- pages -->
  <rect x="14" y="7" width="41" height="51" rx="2" fill="#efe2bf"/>
  <path d="M16 56.5h38M16 54.5h38" stroke="#cdbb8e" stroke-width="0.8"/>
  <!-- front cover -->
  <rect x="9" y="4" width="45" height="52" rx="3" fill="url(#copper)" stroke="#5e3011" stroke-width="1"/>
  <!-- spine -->
  <path d="M12 4h5v52h-5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z" fill="#7a3f17"/>
  <path d="M10 12h7M10 48h7" stroke="#e0a85a" stroke-width="1.5"/>
  <!-- inset border -->
  <rect x="20" y="8" width="31" height="44" rx="1.5" fill="none" stroke="#e8b84a" stroke-width="1" opacity="0.7"/>

  <!-- back star, rotated 45° -->
  <path transform="rotate(45 35.5 30)"
        d="M35.5 21 L37.62 27.88 L44.5 30 L37.62 32.12 L35.5 39 L33.38 32.12 L26.5 30 L33.38 27.88 Z"
        fill="#c8961e" stroke="#7a5410" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- front star -->
  <path d="M35.5 17 L38.33 27.17 L48.5 30 L38.33 32.83 L35.5 43 L32.67 32.83 L22.5 30 L32.67 27.17 Z"
        fill="url(#gold)" stroke="#7a5410" stroke-width="0.6" stroke-linejoin="round"/>
</svg>
