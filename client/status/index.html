<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate status</title>
<style>
/* White on black and nothing else. The eventual readers are a 1-bit e-ink
   panel or a greyscale Kindle, so emphasis is weight, size and inversion —
   never colour, and never a shadow. Anything that needs to shout inverts. */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #000; color: #fff;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
body { padding: 6px; }

.bar {
  border: 2px solid #fff; padding: 5px 8px; margin-bottom: 6px;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-flex-wrap: wrap; flex-wrap: wrap;
  -webkit-box-align: baseline; -webkit-align-items: baseline; align-items: baseline;
}
.bar h1 {
  font-size: 18px; line-height: 1; margin: 0 10px 0 0;
  letter-spacing: 3px; text-transform: uppercase; font-weight: bold;
}
.verdict { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
.age { margin-left: auto; font-size: 13px; }

/* Inversion is the only alarm this page has. */
.alarm { background: #fff; color: #000; padding: 1px 6px; }

.grid { display: -webkit-box; display: -webkit-flex; display: flex;
        -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -3px; }
/* 220px, not 320: three of these have to sit in one row on an 800px panel,
   which is the whole reason the basis is what it is. */
.card { border: 2px solid #fff; padding: 6px 8px; margin: 3px; -webkit-flex: 1 1 220px; flex: 1 1 220px; }
.card h2 {
  font-size: 11px; margin: 0 0 4px 0; letter-spacing: 2px;
  text-transform: uppercase; font-weight: bold;
  border-bottom: 1px solid #fff; padding-bottom: 3px;
}
.wide { -webkit-flex-basis: 100%; flex-basis: 100%; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 2px 8px 2px 0; font-size: 14px; vertical-align: baseline; }
th { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: normal; }
tbody tr + tr td { border-top: 1px solid #fff; }
td.num, th.num { text-align: right; padding-right: 0;
                 font-family: "DejaVu Sans Mono", Consolas, monospace; }
.name { font-weight: bold; }
/* A label that wraps costs a whole row on a panel that cannot scroll. */
tbody td:first-child { white-space: nowrap; }
.quiet { opacity: 0.65; }

/* One line, not a card: an alarm that pushed the data off the bottom of a
   panel that cannot scroll would hide exactly what it was raised about. */
.alarms { border: 2px solid #fff; padding: 5px 8px; margin-bottom: 6px; font-size: 14px; }

/* The state that matters most: we could not reach the box at all. */
.down { border: 4px solid #fff; padding: 20px; text-align: center; margin-bottom: 6px; }
.down .big { font-size: 34px; font-weight: bold; letter-spacing: 4px; }
.down .why { font-size: 15px; margin-top: 8px; }

.hint { font-size: 13px; margin-top: 10px; }
code { font-family: "DejaVu Sans Mono", Consolas, monospace; }
</style>
</head>
<body>
<div id="root">
  <div class="bar"><h1>Slate</h1><span class="verdict">starting…</span></div>
</div>
<script src="status.js"></script>
</body>
</html>
